<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarquia de Pecados - Alma 39:5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gravidade dos Pecados</h1>
    <p class="subtitle">"Pois eis que isto é uma abominação aos olhos do Senhor..." (Alma 39:5)</p>
    
    <div class="chart-wrapper">
        <canvas id="pecadosChart"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('pecadosChart').getContext('2d');
    
    const pecadosChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [
                'Negar o Espírito Santo', 
                'Assassinato', 
                'Imoralidade Sexual (Adultério/Fornicação)', 
                'Pornografia', 
                'Masturbação'
            ],
            datasets: [{
                label: 'Peso de Gravidade Espiritual (Escala Teológica)',
                data: [100, 90, 75, 50, 30], // Valores ilustrativos para representar a hierarquia
                backgroundColor: [
                    'rgba(0, 0, 0, 0.8)',   // Preto para o imperdoável
                    'rgba(192, 57, 43, 0.8)', // Vermelho sangue para assassinato
                    'rgba(230, 126, 34, 0.8)', // Laranja para imoralidade
                    'rgba(241, 196, 15, 0.8)', // Amarelo
                    'rgba(52, 152, 219, 0.8)'  // Azul
                ],
                borderColor: [
                    '#000', '#c0392b', '#d35400', '#f1c40f', '#2980b9'
                ],
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Gravidade aos Olhos do Senhor'
                    },
                    ticks: {
                        callback: function(value) {
                            if (value === 100) return 'Imperdoável';
                            if (value === 75) return 'Grave';
                            if (value === 0) return 'Luz';
                            return '';
                        }
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (context.parsed.y === 100) return 'O pecado imperdoável.';
                            if (context.parsed.y === 90) return 'Derramamento de sangue inocente.';
                            if (context.parsed.y === 75) return 'Abominação acima de tudo, exceto o sangue.';
                            return 'Violação da castidade e pureza.';
                        }
                    }
                }
            }
        }
    });
</script>

</body>
</html>
