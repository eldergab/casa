<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projeto Alma 39:5 - Hierarquia Espiritual</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/drilldown.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        #container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; text-align: center; max-width: 700px; }
    </style>
</head>
<body>

    <h2>Hierarquia de Pecados Graves (Alma 39:5)</h2>
    <p>Clique em uma fatia para ver as subdivisões e a incidência estatística mundial aproximada.</p>

    <div id="container"></div>

<script>
Highcharts.chart('container', {
    chart: {
        type: 'pie'
    },
    title: {
        text: 'Os Três Pecados Mais Graves'
    },
    subtitle: {
        text: 'Fonte: Escrituras e Estimativas Sociológicas Globais'
    },
    accessibility: {
        announceNewData: { enabled: true },
        point: { valueSuffix: '%' }
    },
    plotOptions: {
        series: {
            dataLabels: {
                enabled: true,
                format: '{point.name}: {point.y}%'
            }
        }
    },
    tooltip: {
        headerFormat: '<span style="font-size:11px">{series.name}</span><br>',
        pointFormat: '<span style="color:{point.color}">{point.name}</span>: <b>{point.y}%</b> do total<br/>'
    },

    series: [
        {
            name: "Pecados",
            colorByPoint: true,
            data: [
                {
                    name: "Negar o Espírito Santo",
                    y: 1, // Representação visual no gráfico principal
                    drilldown: "negar"
                },
                {
                    name: "Homicídio",
                    y: 4,
                    drilldown: "homicidio"
                },
                {
                    name: "Lei da Castidade",
                    y: 95,
                    drilldown: "castidade"
                }
            ]
        }
    ],
    drilldown: {
        series: [
            {
                name: "Negar o Espírito Santo",
                id: "negar",
                data: [
                    ["Filhos da Perdição", 0.001],
                    ["Blasfêmia Consciente", 0.009]
                ]
            },
            {
                name: "Homicídio",
                id: "homicidio",
                data: [
                    ["Homicídio Doloso (Intencional)", 0.08],
                    ["Outras formas de violência grave", 0.02]
                ]
            },
            {
                name: "Lei da Castidade",
                id: "castidade",
                data: [
                    ["Fornicação (Solteiros)", 45],
                    ["Masturbação", 35],
                    ["Adultério (Casados)", 12],
                    ["Solteiro envolvido com Casado", 8]
                ]
            }
        ]
    }
});
</script>
</body>
</html>
