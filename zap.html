<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensagem WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: #25d366; }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #128c7e;
        }
        p { font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Direto</h2>
    <p>Digite o número com DDD (ex: 62999999999)</p>
    
    <input type="tel" id="phone" placeholder="DDD + Número" required autofocus>
    <button onclick="enviarMensagem()">Abrir no WhatsApp</button>
</div>

<script>
    function enviarMensagem() {
        let num = document.getElementById('phone').value;
        
        // Remove tudo que não for número
        num = num.replace(/\D/g, '');
        
        if (num.length >= 10) {
            if (num.length === 10 || num.length === 11) {
                num = '55' + num;
            }
            
            // Link direto para a interface do WhatsApp Web no navegador
            const url = `https://web.whatsapp.com/send?phone=${num}&text=`;
            
            // Redireciona na própria aba para não ser bloqueado como pop-up
            window.location.href = url;
        } else {
            alert("Por favor, digite o número completo com DDD.");
        }
    }

    // Permite acionar o botão apertando a tecla Enter
    document.getElementById('phone').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            enviarMensagem();
        }
    });
</script>

</body>
</html>
