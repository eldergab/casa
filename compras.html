<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras da Casa</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* Painel Orçamentário e Destaque */
    .budget-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-card.main-stat {
      background: #eff6ff;
      border-color: #bfdbfe;
      grid-column: span 1;
    }

    .stat-card .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .stat-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-card.main-stat .value {
      font-size: 2.2rem;
      color: var(--primary);
    }

    .stat-card.remaining.negative .value {
      color: var(--danger);
    }

    .stat-card.remaining.positive .value {
      color: var(--success);
    }

    .budget-input-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }

    .budget-input-wrapper span {
      font-weight: 600;
      color: var(--text-muted);
    }

    .budget-input-wrapper input {
      width: 120px;
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 6px;
    }

    /* Formulário de Adicionar */
    .add-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .add-form {
        grid-template-columns: 1fr 1fr;
      }
      .add-form input:nth-child(1) {
        grid-column: span 2;
      }
      .add-form button {
        grid-column: span 2;
      }
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    button.btn-add {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn-add:hover {
      background-color: var(--primary-hover);
    }

    /* Controles e Progresso */
    .dashboard-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filters button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      margin-right: 4px;
    }

    .filters button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Lista de Itens */
    .category-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 20px 0 10px 0;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--border);
      padding-bottom: 4px;
    }

    .item-list {
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.2s;
      gap: 10px;
    }

    .item:hover {
      border-color: #cbd5e1;
    }

    .item.completed {
      background: #f8fafc;
      opacity: 0.85;
    }

    .item.completed .item-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .item-left input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .item-qty-target {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .input-field-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .input-field-group input {
      padding: 6px 8px;
      font-size: 0.9rem;
      border-radius: 6px;
    }

    .input-qty {
      width: 65px;
      text-align: center;
    }

    .input-price {
      width: 85px;
      text-align: right;
    }

    .item-subtotal {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 80px;
      text-align: right;
      color: var(--text);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    @media (max-width: 680px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }
      .item-right {
        width: 100%;
        justify-content: space-between;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛒 Lista & Calculadora de Compras</h1>
      <p>Planejamento de mercado e controle financeiro para 6 pessoas</p>
    </header>

    <!-- Painel Financeiro -->
    <div class="budget-panel">
      <div class="stat-card main-stat">
        <div class="label">Total Comprado (Já Gastei)</div>
        <div class="value" id="totalSpent">R$ 0,00</div>
      </div>

      <div class="stat-card">
        <div class="label">Orçamento Disponível</div>
        <div class="budget-input-wrapper">
          <span>R$</span>
          <input type="number" id="budgetAmount" step="10" min="0" placeholder="0.00" oninput="updateBudget()">
        </div>
      </div>

      <div class="stat-card remaining" id="remainingCard">
        <div class="label">Saldo Restante</div>
        <div class="value" id="remainingBalance">R$ 0,00</div>
      </div>
    </div>

    <!-- Adicionar Novo Item -->
    <div class="card">
      <form id="itemForm" class="add-form">
        <input type="text" id="itemName" placeholder="Nome do item (ex: Macarrão, Leite)" required>
        <input type="text" id="itemQtyTarget" placeholder="Meta de Qtd (ex: 5 kg, 12 un)" required>
        <select id="itemCategory">
          <option value="Alimentos">🌾 Alimentos</option>
          <option value="Hortifruti">🍎 Hortifruti</option>
          <option value="Limpeza">🧼 Limpeza</option>
          <option value="Outros">📦 Outros</option>
        </select>
        <button type="submit" class="btn-add">Adicionar</button>
      </form>
    </div>

    <!-- Progresso e Lista -->
    <div class="card">
      <div class="dashboard-controls">
        <div class="filters">
          <button class="active" onclick="filterItems('all')">Todos</button>
          <button onclick="filterItems('pending')">Pendentes</button>
          <button onclick="filterItems('completed')">Comprados</button>
        </div>
        <span id="statusCount" style="font-size: 0.88rem; color: var(--text-muted);">0 / 0 itens comprados</span>
      </div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar"></div>
      </div>

      <!-- Renderização da Lista -->
      <div id="shoppingList"></div>
    </div>
  </div>

  <script>
    // Lista inicial ajustada (Foco amplo em ALIMENTOS para 6 pessoas, sem café, limpeza essencial)
    const defaultItems = [
      // ALIMENTOS (Mais itens e maior volume)
      { id: 1, name: "Arroz Tipo 1", qtyTarget: "15 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 2, name: "Feijão Carioca", qtyTarget: "6 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 3, name: "Óleo de Soja", qtyTarget: "6 garrafas", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 4, name: "Açúcar Refinado / Cristal", qtyTarget: "5 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 5, name: "Sal Refinado", qtyTarget: "2 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 6, name: "Macarrão (Espaguete / Penne)", qtyTarget: "8 pacotes (500g)", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 7, name: "Molho de Tomate", qtyTarget: "10 saches", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 8, name: "Farinha de Trigo", qtyTarget: "4 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 9, name: "Farinha de Milho / Fubá", qtyTarget: "3 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 10, name: "Leite Integral", qtyTarget: "24 caixas (1L)", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 11, name: "Achocolatado em Pó", qtyTarget: "2 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 12, name: "Manteiga / Margarina", qtyTarget: "3 potes (500g)", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 13, name: "Biscoito Doce / Salgado", qtyTarget: "10 pacotes", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 14, name: "Proteína: Carne Bovina", qtyTarget: "8 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 15, name: "Proteína: Frango (Peito/Coxa)", qtyTarget: "10 kg", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 16, name: "Ovos", qtyTarget: "3 cartelas (90 ovos)", category: "Alimentos", boughtQty: 0, unitPrice: 0, completed: false },

      // HORTIFRUTI
      { id: 17, name: "Cebola", qtyTarget: "4 kg", category: "Hortifruti", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 18, name: "Alho", qtyTarget: "1 kg", category: "Hortifruti", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 19, name: "Batata", qtyTarget: "6 kg", category: "Hortifruti", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 20, name: "Tomate", qtyTarget: "5 kg", category: "Hortifruti", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 21, name: "Banana / Frutas da Estação", qtyTarget: "8 kg", category: "Hortifruti", boughtQty: 0, unitPrice: 0, completed: false },

      // LIMPEZA (Essencial)
      { id: 22, name: "Detergente Líquido", qtyTarget: "6 frascos", category: "Limpeza", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 23, name: "Sabão em Pó / Líquido", qtyTarget: "5 kg", category: "Limpeza", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 24, name: "Desinfetante", qtyTarget: "3 litros", category: "Limpeza", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 25, name: "Água Sanitária", qtyTarget: "4 litros", category: "Limpeza", boughtQty: 0, unitPrice: 0, completed: false },
      { id: 26, name: "Papel Higiênico", qtyTarget: "1 pacote (24 rolos)", category: "Limpeza", boughtQty: 0, unitPrice: 0, completed: false }
    ];

    // Carregar do localStorage
    let items = JSON.parse(localStorage.getItem('house_shopping_list_v2')) || defaultItems;
    let userBudget = parseFloat(localStorage.getItem('house_shopping_budget')) || 0;
    let currentFilter = 'all';

    const form = document.getElementById('itemForm');
    const shoppingListContainer = document.getElementById('shoppingList');
    const progressBar = document.getElementById('progressBar');
    const statusCount = document.getElementById('statusCount');
    const totalSpentEl = document.getElementById('totalSpent');
    const budgetInput = document.getElementById('budgetAmount');
    const remainingBalanceEl = document.getElementById('remainingBalance');
    const remainingCard = document.getElementById('remainingCard');

    if (userBudget > 0) {
      budgetInput.value = userBudget;
    }

    function saveState() {
      localStorage.setItem('house_shopping_list_v2', JSON.stringify(items));
      localStorage.setItem('house_shopping_budget', userBudget);
    }

    function updateBudget() {
      userBudget = parseFloat(budgetInput.value) || 0;
      saveState();
      calculateTotals();
    }

    // Adicionar Novo Item
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('itemName').value.trim();
      const qtyTarget = document.getElementById('itemQtyTarget').value.trim();
      const category = document.getElementById('itemCategory').value;

      if (name && qtyTarget) {
        const newItem = {
          id: Date.now(),
          name,
          qtyTarget,
          category,
          boughtQty: 0,
          unitPrice: 0,
          completed: false
        };

        items.push(newItem);
        saveState();
        renderList();
        form.reset();
      }
    });

    function toggleComplete(id) {
      items = items.map(item => {
        if (item.id === id) {
          item.completed = !item.completed;
          if (item.completed && item.boughtQty === 0) {
            item.boughtQty = 1;
          }
        }
        return item;
      });
      saveState();
      renderList();
    }

    function updateItemValues(id, field, value) {
      const numericVal = parseFloat(value) || 0;
      items = items.map(item => {
        if (item.id === id) {
          item[field] = numericVal;
          if (field === 'boughtQty' && numericVal > 0 && !item.completed) {
            item.completed = true;
          }
        }
        return item;
      });
      saveState();
      calculateTotals();
      
      const subtotalEl = document.getElementById(`subtotal-${id}`);
      const checkboxEl = document.getElementById(`check-${id}`);
      const itemObj = items.find(i => i.id === id);
      
      if (subtotalEl && itemObj) {
        const subtotal = itemObj.boughtQty * itemObj.unitPrice;
        subtotalEl.innerText = formatCurrency(subtotal);
      }
      if (checkboxEl && itemObj) {
        checkboxEl.checked = itemObj.completed;
        const itemCard = document.getElementById(`item-card-${id}`);
        if (itemCard) {
          if (itemObj.completed) itemCard.classList.add('completed');
          else itemCard.classList.remove('completed');
        }
      }
    }

    function deleteItem(id) {
      items = items.filter(item => item.id !== id);
      saveState();
      renderList();
    }

    function filterItems(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function formatCurrency(val) {
      return val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function calculateTotals() {
      let totalSpent = 0;

      items.forEach(item => {
        if (item.completed || item.boughtQty > 0) {
          totalSpent += (item.boughtQty * item.unitPrice);
        }
      });

      totalSpentEl.innerText = formatCurrency(totalSpent);

      const remaining = userBudget - totalSpent;
      remainingBalanceEl.innerText = formatCurrency(remaining);

      if (remaining < 0) {
        remainingCard.className = 'stat-card remaining negative';
      } else {
        remainingCard.className = 'stat-card remaining positive';
      }

      const totalCount = items.length;
      const completedCount = items.filter(i => i.completed).length;
      const percentage = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

      progressBar.style.width = `${percentage}%`;
      statusCount.innerText = `${completedCount} de ${totalCount} itens comprados (${percentage}%)`;
    }

    function renderList() {
      shoppingListContainer.innerHTML = '';

      let filteredItems = items.filter(item => {
        if (currentFilter === 'pending') return !item.completed;
        if (currentFilter === 'completed') return item.completed;
        return true;
      });

      if (filteredItems.length === 0) {
        shoppingListContainer.innerHTML = `<div class="empty-state">Nenhum item encontrado nesta visualização.</div>`;
        calculateTotals();
        return;
      }

      const categories = ['Alimentos', 'Hortifruti', 'Limpeza', 'Outros'];

      categories.forEach(cat => {
        const catItems = filteredItems.filter(item => item.category === cat);

        if (catItems.length > 0) {
          const catTitle = document.createElement('div');
          catTitle.className = 'category-title';
          catTitle.innerText = cat;
          shoppingListContainer.appendChild(catTitle);

          const ul = document.createElement('ul');
          ul.className = 'item-list';

          catItems.forEach(item => {
            const subtotal = item.boughtQty * item.unitPrice;
            const li = document.createElement('li');
            li.id = `item-card-${item.id}`;
            li.className = `item ${item.completed ? 'completed' : ''}`;
            
            li.innerHTML = `
              <div class="item-left">
                <input type="checkbox" id="check-${item.id}" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})">
                <div class="item-info">
                  <span class="item-name">${item.name}</span>
                  <span class="item-qty-target">Meta: ${item.qtyTarget}</span>
                </div>
              </div>

              <div class="item-right">
                <div class="input-field-group">
                  <label>Qtd:</label>
                  <input type="number" class="input-qty" min="0" step="1" value="${item.boughtQty || ''}" placeholder="0" oninput="updateItemValues(${item.id}, 'boughtQty', this.value)">
                </div>

                <div class="input-field-group">
                  <label>R$ un:</label>
                  <input type="number" class="input-price" min="0" step="0.01" value="${item.unitPrice || ''}" placeholder="0.00" oninput="updateItemValues(${item.id}, 'unitPrice', this.value)">
                </div>

                <div class="item-subtotal" id="subtotal-${item.id}">
                  ${formatCurrency(subtotal)}
                </div>

                <button class="btn-delete" onclick="deleteItem(${item.id})" title="Excluir">🗑️</button>
              </div>
            `;
            ul.appendChild(li);
          });

          shoppingListContainer.appendChild(ul);
        }
      });

      calculateTotals();
    }

    renderList();
  </script>
</body>
</html>
