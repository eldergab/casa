<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Amigo Secreto Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
h2 {
    text-align: center;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
button {
    border: none;
    font-size: 15px;
    cursor: pointer;
}
.btn-whats { background: #25d366; color: white; }
.btn-info { background: #007bff; color: white; }
.btn-view { background: #6c757d; color: white; }
.btn-admin { background: #dc3545; color: white; }

.result {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}
small {
    display: block;
    text-align: center;
    margin-top: 10px;
    color: #777;
}
</style>
</head>

<body>

<div class="container">
    <h2>Amigo Secreto 🎁</h2>

    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="text" id="whatsapp" placeholder="WhatsApp (ex: 5562999999999)">

    <button class="btn-whats" onclick="revelar()">🎁 Revelar Amigo Secreto</button>
    <button class="btn-view" onclick="verMeuAmigo()">🔍 Ver meu amigo secreto</button>
    <button class="btn-info" onclick="mostrarRegras()">📜 Regras</button>
    <button class="btn-admin" onclick="resetar()">🔒 Resetar </button>

    <div class="result" id="resultado"></div>
    <small>Sorteio individual e confidencial</small>
</div>

<script>
const participantes = [
    "Elder Ribeiro",
    "Elder Taylor",
    "Thomas",
    "Melanie",
    "Joyce",
    "Emerson",
    "Emily",
    "Joseph",
    "Edna",
    "Augusto",
    "Josie",
    "Cox",
    "Kainã"
];

const SENHA_ADMIN = "emerson123"; // 🔒 troque se quiser

let sorteios = JSON.parse(localStorage.getItem("sorteios")) || {};

function revelar() {
    const nome = document.getElementById("nome").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const resultado = document.getElementById("resultado");

    if (!nome || !whatsapp) {
        resultado.innerHTML = "⚠️ Preencha todos os campos.";
        return;
    }

    if (!participantes.includes(nome)) {
        resultado.innerHTML = "❌ Nome não está na lista.";
        return;
    }

    if (sorteios[nome]) {
        resultado.innerHTML = "⚠️ Você já sorteou. Use 'Ver meu amigo secreto'.";
        return;
    }

    let disponiveis = participantes.filter(p =>
        p !== nome && !Object.values(sorteios).includes(p)
    );

    if (disponiveis.length === 0) {
        resultado.innerHTML = "❌ Não há mais nomes disponíveis.";
        return;
    }

    const amigo = disponiveis[Math.floor(Math.random() * disponiveis.length)];
    sorteios[nome] = amigo;
    localStorage.setItem("sorteios", JSON.stringify(sorteios));

    resultado.innerHTML = `🎉 Seu amigo secreto é:<br><strong>${amigo}</strong>`;

    const mensagem = encodeURIComponent(
        `🎁 Amigo Secreto 🎁\n\nOlá ${nome}!\nSeu amigo secreto é: *${amigo}*\n\nGuarde esta mensagem 😉`
    );

    window.open(`https://wa.me/${whatsapp}?text=${mensagem}`, "_blank");
}

function verMeuAmigo() {
    const nome = document.getElementById("nome").value.trim();
    const resultado = document.getElementById("resultado");

    if (!nome) {
        resultado.innerHTML = "⚠️ Digite seu nome.";
        return;
    }

    if (!sorteios[nome]) {
        resultado.innerHTML = "❌ Nenhum sorteio encontrado para este nome.";
        return;
    }

    resultado.innerHTML = `🎁 Seu amigo secreto é:<br><strong>${sorteios[nome]}</strong>`;
}

function mostrarRegras() {
    alert(
`📜 REGRAS DO AMIGO SECRETO

✔ Só participa quem está na lista
✔ Cada pessoa sorteia apenas uma vez
✔ O nome é enviado pelo WhatsApp
✔ Ninguém vê o sorteio dos outros
✔ Apenas o Admin pode resetar o sistema`
    );
}

function resetar() {
    const senha = prompt("Digite a senha do administrador:");

    if (senha === SENHA_ADMIN) {
        localStorage.removeItem("sorteios");
        sorteios = {};
        document.getElementById("resultado").innerHTML = "✅ Sorteio resetado com sucesso.";
    } else {
        alert("❌ Senha incorreta.");
    }
}
</script>

</body>
</html>
